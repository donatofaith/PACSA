<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Reset Student Password | PACSA
    </title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #4c1d95,
                    #7c3aed
                );
        }

        .card {

            width: 100%;
            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.2);
        }

        .logo {

            display: block;

            width: 70px;
            height: 70px;

            object-fit: contain;

            margin:
                0 auto
                15px;
        }

        h1 {

            text-align: center;

            color: #5b21b6;

            margin:
                0 0
                8px;
        }

        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 28px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;
        }

        .field {

            position: relative;

            margin-bottom: 20px;
        }

        input {

            width: 100%;
            height: 52px;

            padding:
                0 48px
                0 15px;

            border:
                1px solid #ccc;

            border-radius: 10px;

            font-size: 16px;

            outline: none;
        }

        .eye {

            position: absolute;

            right: 14px;
            top: 39px;

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 18px;
        }

        .submit-btn {

            width: 100%;
            height: 52px;

            border: none;

            border-radius: 10px;

            background: #6d28d9;

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .message {

            display: none;

            margin-top: 18px;

            padding: 13px;

            border-radius: 9px;

            text-align: center;
        }

        .message.error {

            display: block;

            background: #fee2e2;

            color: #b91c1c;
        }

        .message.success {

            display: block;

            background: #dcfce7;

            color: #166534;
        }

        .back {

            display: block;

            margin-top: 20px;

            text-align: center;

            color: #6d28d9;

            font-weight: bold;

            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="card">

    <img
        src="images/PACSA LOGO.png"
        alt="PACSA Logo"
        class="logo"
    >


    <h1>
        Create New Password
    </h1>


    <p class="subtitle">
        Enter your new Student Portal password.
    </p>


    <form id="resetForm">


        <div class="field">

            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                minlength="8"
                required
            >

            <button
                type="button"
                class="eye"
                data-toggle="newPassword"
            >
                👁
            </button>

        </div>


        <div class="field">

            <label for="confirmPassword">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                minlength="8"
                required
            >

            <button
                type="button"
                class="eye"
                data-toggle="confirmPassword"
            >
                👁
            </button>

        </div>


        <button
            type="submit"
            id="resetBtn"
            class="submit-btn"
        >
            Update Password
        </button>


        <div
            id="message"
            class="message"
        ></div>


    </form>


    <a
        href="student-login.html"
        class="back"
    >
        ← Back to Student Login
    </a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

const $ = id =>
    document.getElementById(id);


function showMessage(
    text,
    type = "error"
) {

    const box =
        $("message");

    box.textContent =
        text;

    box.className =
        `message ${type}`;
}


document
    .querySelectorAll(
        "[data-toggle]"
    )
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const input =
                    $(
                        button.dataset.toggle
                    );


                const hidden =
                    input.type ===
                    "password";


                input.type =
                    hidden
                        ? "text"
                        : "password";


                button.textContent =
                    hidden
                        ? "🙈"
                        : "👁";
            }
        );
    });


$("resetForm")
    .addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const password =
                $("newPassword").value;


            const confirmPassword =
                $("confirmPassword").value;


            const button =
                $("resetBtn");


            if (
                password.length < 8
            ) {

                showMessage(
                    "Password must contain at least 8 characters."
                );

                return;
            }


            if (
                password !==
                confirmPassword
            ) {

                showMessage(
                    "Passwords do not match."
                );

                return;
            }


            button.disabled =
                true;

            button.textContent =
                "Updating...";


            try {

                const {
                    data,
                    error:
                    sessionError
                } =
                    await supabaseClient
                        .auth
                        .getSession();


                if (sessionError)
                    throw sessionError;


                if (!data?.session) {

                    throw new Error(
                        "This password reset link is invalid or expired. Request another reset link."
                    );
                }


                const { error } =
                    await supabaseClient
                        .auth
                        .updateUser({

                            password

                        });


                if (error)
                    throw error;


                showMessage(
                    "Password changed successfully. Redirecting to login...",
                    "success"
                );


                await supabaseClient
                    .auth
                    .signOut();


                setTimeout(
                    () => {

                        window.location.replace(
                            "student-login.html"
                        );

                    },
                    1800
                );


            } catch (error) {

                console.error(
                    "Student password reset:",
                    error
                );


                showMessage(
                    error?.message ||
                    "Could not update password."
                );


            } finally {

                button.disabled =
                    false;

                button.textContent =
                    "Update Password";
            }
        }
    );

</script>


</body>

</html>
