<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PACSA Admin Portal</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="admin-login.css"
    >

    <style>
        .login-message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
        }

        .login-message.error {
            display: block;
            background: #FEE2E2;
            color: #B91C1C;
        }

        .login-message.success {
            display: block;
            background: #DCFCE7;
            color: #166534;
        }

        .admin-note {
            text-align: center;
            font-size: 12px;
            margin-top: 18px;
            opacity: 0.75;
        }

        .back-link {
            display: block;
            margin-top: 16px;
            text-align: center;
            color: #FFFFFF;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            opacity: 0.9;
        }

        .back-link:hover {
            opacity: 1;
            text-decoration: underline;
        }
    </style>
</head>


<body>

<div class="overlay"></div>


<div class="container">

    <div class="login-card">

        <img
            src="images/PACSA LOGO.png"
            alt="PACSA Logo"
            class="logo"
        >

        <h1>PACSA</h1>

        <p class="subtitle">
            School Management Portal
        </p>


        <form id="loginForm">

            <div class="input-box">

                <label for="email">
                    Admin Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter Admin Email"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="input-box">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter Password"
                        autocomplete="current-password"
                        required
                    >

                    <span
                        id="togglePassword"
                        role="button"
                        tabindex="0"
                    >
                        👁
                    </span>

                </div>

            </div>


            <div class="options">

                <span>
                    Admin Portal
                </span>

                <a
                    href="#"
                    id="forgotPasswordLink"
                >
                    Forgot Password?
                </a>

            </div>


            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                Login
            </button>

        </form>


        <div
            id="loginMessage"
            class="login-message"
        ></div>


        <p class="admin-note">
            Administrator accounts are created internally by PACSA.
        </p>

        <a
            href="index.html"
            class="back-link"
        >
            ← Back to Home
        </a>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="admin-login.js"></script>


</body>

</html>
