<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Teacher Account Activation | PACSA
    </title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    rgba(80, 36, 145, 0.82),
                    rgba(80, 36, 145, 0.82)
                ),
                url("images/PACSA LOGO.png");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding:
                30px 15px;
        }


        .register-card {

            width: 100%;
            max-width: 540px;

            background: white;

            border-radius: 28px;

            padding:
                38px 42px;

            box-shadow:
                0 20px 55px
                rgba(0, 0, 0, 0.18);
        }


        .logo-area {
            text-align: center;
            margin-bottom: 28px;
        }


        .logo-area img {

            width: 70px;
            height: 70px;

            object-fit: contain;

            margin-bottom: 10px;
        }


        .logo-area h1 {

            color: #5b21b6;

            font-size: 38px;

            margin-bottom: 8px;
        }


        .logo-area h2 {

            color: #7c3aed;

            font-size: 25px;

            margin-bottom: 10px;
        }


        .logo-area p {

            color: #666;

            font-size: 16px;
        }


        .notice {

            background: #f1e5ff;

            color: #6427c7;

            text-align: center;

            padding:
                17px 20px;

            border-radius: 14px;

            line-height: 1.5;

            margin-bottom: 25px;
        }


        .form-group {

            margin-bottom: 22px;
        }


        .form-group label {

            display: block;

            font-size: 18px;
            font-weight: 700;

            color: #333;

            margin-bottom: 9px;
        }


        .form-group input {

            width: 100%;

            height: 61px;

            border:
                1px solid #d5d5d5;

            border-radius: 13px;

            padding:
                0 17px;

            font-size: 17px;

            outline: none;

            transition: 0.2s;
        }


        .form-group input:focus {

            border-color: #6d28d9;

            box-shadow:
                0 0 0 3px
                rgba(109, 40, 217, 0.10);
        }


        .password-wrapper {

            position: relative;

            width: 100%;
        }


        .password-wrapper input {

            padding-right: 58px;
        }


        .password-toggle {

            position: absolute;

            top: 50%;
            right: 15px;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 19px;

            padding: 7px;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        .primary-btn {

            width: 100%;
            height: 61px;

            border: none;

            border-radius: 13px;

            background: #5b21c7;

            color: white;

            font-size: 18px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }


        .primary-btn:hover {

            background: #4c1d95;
        }


        .primary-btn:disabled {

            opacity: 0.65;

            cursor: not-allowed;
        }


        .resend-btn {

            width: 100%;

            min-height: 55px;

            margin-top: 12px;

            border:
                2px solid #6d28d9;

            border-radius: 13px;

            background: white;

            color: #6d28d9;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            display: none;
        }


        .resend-btn:hover {

            background: #f5efff;
        }


        .message {

            display: none;

            text-align: center;

            padding:
                14px 17px;

            border-radius: 12px;

            margin-top: 18px;

            font-size: 15px;

            line-height: 1.45;
        }


        .message.error {

            display: block;

            background: #fee2e2;

            color: #c62828;
        }


        .message.success {

            display: block;

            background: #dcfce7;

            color: #16803c;
        }


        .login-link {

            text-align: center;

            margin-top: 23px;
        }


        .login-link a {

            color: #5b21c7;

            font-weight: 700;

            text-decoration: none;
        }


        .login-link a:hover {

            text-decoration: underline;
        }


        @media (
            max-width: 600px
        ) {

            body {

                padding:
                    15px 10px;
            }


            .register-card {

                padding:
                    30px 22px;

                border-radius: 20px;
            }


            .logo-area h1 {

                font-size: 32px;
            }


            .logo-area h2 {

                font-size: 22px;
            }
        }

    </style>

</head>


<body>


    <main class="register-card">


        <div class="logo-area">

            <img
                src="images/PACSA LOGO.png"
                alt="PACSA Logo"
            >

            <h1>
                PACSA
            </h1>

            <h2>
                Teacher Account Activation
            </h2>

            <p>
                Becoming Leaders Through Righteousness
            </p>

        </div>


        <div class="notice">

            Only teachers already created by the PACSA
            administrator can activate a Teacher Portal account.

        </div>


        <form id="teacherRegisterForm">


            <div class="form-group">

                <label for="teacherId">

                    Teacher ID

                </label>


                <input
                    type="text"
                    id="teacherId"
                    placeholder="Enter Teacher ID"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">

                    Registered Email

                </label>


                <input
                    type="email"
                    id="email"
                    placeholder="Enter registered email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">

                    Create Password

                </label>


                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Create Password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >


                    <button
                        type="button"
                        id="togglePassword"
                        class="password-toggle"
                        aria-label="Show password"
                    >
                        👁
                    </button>

                </div>

            </div>


            <div class="form-group">

                <label for="confirmPassword">

                    Confirm Password

                </label>


                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm Password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >


                    <button
                        type="button"
                        id="toggleConfirmPassword"
                        class="password-toggle"
                        aria-label="Show confirm password"
                    >
                        👁
                    </button>

                </div>

            </div>


            <button
                type="submit"
                id="registerBtn"
                class="primary-btn"
            >

                Activate Account

            </button>


            <button
                type="button"
                id="resendVerificationBtn"
                class="resend-btn"
            >

                Resend Verification Email

            </button>


            <div
                id="registerMessage"
                class="message"
            ></div>


        </form>


        <div class="login-link">

            <a href="teacher-login.html">

                ← Back to Teacher Login

            </a>

        </div>


    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="supabase.js"></script>

   <script src="teacher-login.js?v=3"></script>

</body>

</html>
