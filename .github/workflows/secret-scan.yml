name: Secret scan

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tracked files for high-risk secrets
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          patterns = {
              "Brevo API key": re.compile(r"xkeysib-[A-Za-z0-9_-]{20,}"),
              "GitHub classic token": re.compile(r"\bghp_[A-Za-z0-9]{20,}\b"),
              "GitHub fine-grained token": re.compile(r"\bgithub_pat_[A-Za-z0-9_]{20,}\b"),
              "AWS access key": re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              "Private key": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "Stripe secret key": re.compile(r"\bsk_(?:live|test)_[A-Za-z0-9]{16,}\b"),
              "Supabase legacy JWT": re.compile(r"\beyJ[A-Za-z0-9_-]{20,}\\.[A-Za-z0-9_-]{20,}\\.[A-Za-z0-9_-]{20,}\b"),
          }

          allowed_paths = {".env.example"}
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          findings = []

          for name in tracked:
              if not name or name in allowed_paths:
                  continue
              path = pathlib.Path(name)
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              for label, pattern in patterns.items():
                  for match in pattern.finditer(text):
                      line = text.count("\n", 0, match.start()) + 1
                      findings.append((name, line, label))

          if findings:
              print("Potential secret material found in tracked files:")
              for name, line, label in findings:
                  print(f"  {name}:{line} - {label}")
              print("\nRemove the secret from Git history and rotate it before merging.")
              sys.exit(1)

          print("No high-risk secret patterns found in tracked files.")
          PY
