<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PACSA Teacher Login</title>

<link
href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="teacher-login.css">

</head>


<body>


<div class="overlay"></div>


<div class="login-container">


    <div class="login-card">


        <img
        src="images/PACSA LOGO.png"
        alt="PACSA Logo"
        class="logo">


        <h1>
            PACSA
        </h1>


        <p class="portal-title">
            Teacher Portal
        </p>


        <p class="motto">
            Becoming Leaders Through Righteousness
        </p>


        <form id="teacherLoginForm">


            <div class="input-group">

                <label>
                    Teacher ID
                </label>

                <input
                type="text"
                id="teacherId"
                placeholder="Enter Teacher ID"
                required>

            </div>


            <div class="input-group">

                <label>
                    Password
                </label>


                <div class="password-box">

                    <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required>

                    <span id="togglePassword">
                        👁
                    </span>

                </div>

            </div>


            <div class="extras">

                <label>

                    <input
                    type="checkbox">

                    Remember Me

                </label>


                <a href="#">
                    Forgot Password?
                </a>

            </div>


            <button
            type="submit"
            class="login-btn">

                Login

            </button>


        </form>


        <a
        href="index.html"
        class="back-link">

            ← Back to Home

        </a>


    </div>

</div>


<!-- SUPABASE -->

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script src="supabase.js"></script>


<script src="teacher-login.js"></script>


</body>

</html>
