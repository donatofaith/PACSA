<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PACSA Admission Form</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="apply.css"
    >
</head>

<body>

<div class="overlay"></div>

<div class="form-container">
    <div class="form-card">
        <img
            src="images/PACSA LOGO.png"
            alt="PACSA Logo"
            class="logo"
        >

        <h1>PACSA Admission Form</h1>

        <p class="subtitle">
            Complete the form below and our admissions team will contact you.
        </p>

        <form id="applicationForm">
            <div class="form-group">
                <label for="fullName">Applicant Full Name</label>
                <input type="text" id="fullName" required>
            </div>

            <div class="form-group">
                <label for="dateOfBirth">Date of Birth</label>
                <input type="date" id="dateOfBirth" required>
                <small id="ageHelp">
                    Applicant must be at least 9 years old.
                </small>
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div class="form-group">
                <label for="classApplying">Class Applying For</label>
                <select id="classApplying" required>
                    <option value="">Select Class</option>
                    <option value="JSS1">JSS1</option>
                    <option value="JSS2">JSS2</option>
                    <option value="JSS3">JSS3</option>
                    <option value="SS1">SS1</option>
                    <option value="SS2">SS2</option>
                    <option value="SS3">SS3</option>
                </select>
            </div>

            <div class="form-group">
                <label for="parentName">Parent/Guardian Name</label>
                <input type="text" id="parentName" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="address">Home Address</label>
                <textarea id="address" rows="3" required></textarea>
            </div>

            <div class="form-group">
                <label for="previousSchool">Previous School</label>
                <input type="text" id="previousSchool">
            </div>

            <div class="form-group">
                <label for="additionalInformation">Additional Information</label>
                <textarea id="additionalInformation" rows="4"></textarea>
            </div>

            <p id="formMessage"></p>

            <button
                type="submit"
                class="submit-btn"
                id="submitBtn"
            >
                Submit Application
            </button>

            <a href="index.html" class="back-home-btn">
                Back to Home
            </a>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
/* =========================================
   PACSA ADMISSION FORM
   MINIMUM AGE: 9 YEARS
========================================= */

const form = document.getElementById("applicationForm");
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("formMessage");
const dateOfBirthInput = document.getElementById("dateOfBirth");

function getMinimumAgeDate() {
    const today = new Date();
    const maximumBirthDate = new Date(
        today.getFullYear() - 9,
        today.getMonth(),
        today.getDate()
    );

    const year = maximumBirthDate.getFullYear();
    const month = String(maximumBirthDate.getMonth() + 1).padStart(2, "0");
    const day = String(maximumBirthDate.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}

function isAtLeastNineYearsOld(dateString) {
    if (!dateString) return false;

    const birthDate = new Date(`${dateString}T00:00:00`);
    const today = new Date();

    let age = today.getFullYear() - birthDate.getFullYear();
    const monthDifference = today.getMonth() - birthDate.getMonth();

    if (
        monthDifference < 0 ||
        (monthDifference === 0 && today.getDate() < birthDate.getDate())
    ) {
        age--;
    }

    return age >= 9;
}

function showMessage(text, color) {
    message.style.color = color;
    message.textContent = text;
}

function getFriendlyError(error) {
    const text = String(error?.message || error || "").toLowerCase();

    if (text.includes("9 years")) {
        return "Applicant must be at least 9 years old.";
    }

    if (
        text.includes("already registered") ||
        text.includes("duplicate") ||
        text.includes("23505")
    ) {
        return "This email is already registered in PACSA. Please use another email or contact the school.";
    }

    return "Could not submit application: " + (error?.message || "Unknown error");
}

async function notifyAdminAboutApplication(application) {
    try {
        const { error } = await supabaseClient.functions.invoke(
            "smooth-api",
            {
                body: {
                    type: "new_application",
                    application_id: application.id,
                    full_name: application.full_name,
                    email: application.email,
                    class: application.class,
                    parent_name: application.parent_name,
                    phone: application.phone
                }
            }
        );

        if (error) {
            console.warn("Admin application email notification failed:", error);
        }
    } catch (error) {
        console.warn("Admin application email notification failed:", error);
    }
}

dateOfBirthInput.max = getMinimumAgeDate();

dateOfBirthInput.addEventListener("change", () => {
    const value = dateOfBirthInput.value;
    dateOfBirthInput.setCustomValidity("");

    if (value && !isAtLeastNineYearsOld(value)) {
        dateOfBirthInput.setCustomValidity("Applicant must be at least 9 years old.");
        dateOfBirthInput.reportValidity();
    }
});

form.addEventListener("submit", async event => {
    event.preventDefault();

    message.textContent = "";
    message.style.color = "";

    const dateOfBirth = dateOfBirthInput.value;

    if (!isAtLeastNineYearsOld(dateOfBirth)) {
        showMessage("Applicant must be at least 9 years old.", "#dc2626");
        dateOfBirthInput.setCustomValidity("Applicant must be at least 9 years old.");
        dateOfBirthInput.reportValidity();
        return;
    }

    dateOfBirthInput.setCustomValidity("");

    if (!form.checkValidity()) {
        form.reportValidity();
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";

    const application = {
        full_name: document.getElementById("fullName").value.trim(),
        date_of_birth: dateOfBirth,
        gender: document.getElementById("gender").value,
        class: document.getElementById("classApplying").value,
        parent_name: document.getElementById("parentName").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim().toLowerCase(),
        address: document.getElementById("address").value.trim(),
        previous_school: document.getElementById("previousSchool").value.trim(),
        additional_information: document.getElementById("additionalInformation").value.trim(),
        status: "pending"
    };

    try {
        const { data, error } = await supabaseClient
            .from("applications")
            .insert([application])
            .select("id, full_name, email, class, parent_name, phone, status, created_at")
            .single();

        if (error) throw error;

        await notifyAdminAboutApplication(data || application);

        showMessage(
            "Application submitted successfully! Our admissions team will contact you.",
            "#15803d"
        );

        form.reset();
        dateOfBirthInput.max = getMinimumAgeDate();

    } catch (error) {
        console.error("Application submission error:", error);
        showMessage(getFriendlyError(error), "#dc2626");

    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Application";
    }
});
</script>

</body>
</html>
