<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PACSA Admission Form</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="apply.css">

</head>
<body>

<div class="overlay"></div>

<div class="form-container">

<div class="form-card">

<img src="images/PACSA LOGO.png" alt="PACSA Logo" class="logo">

<h1>PACSA Admission Form</h1>

<p class="subtitle">
Complete the form below and our admissions team will contact you.
</p>

<form action="https://formsubmit.co/donatofaith77@gmail.com" method="POST">

<input type="hidden" name="_subject" value="New PACSA Admission Application">

<input type="hidden" name="_captcha" value="false">

<div class="form-group">
<label>Applicant Full Name</label>
<input type="text" name="Full Name" required>
</div>

<div class="form-group">
<label>Date of Birth</label>
<input type="date" name="Date of Birth" required>
</div>

<div class="form-group">
<label>Gender</label>
<select name="Gender" required>
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
</select>
</div>

<div class="form-group">
<label>Class Applying For</label>
<select name="Class" required>
<option value="">Select Class</option>
<option>JSS1</option>
<option>JSS2</option>
<option>JSS3</option>
<option>SS1</option>
<option>SS2</option>
<option>SS3</option>
</select>
</div>

<div class="form-group">
<label>Parent/Guardian Name</label>
<input type="text" name="Parent Name" required>
</div>

<div class="form-group">
<label>Phone Number</label>
<input type="tel" name="Phone Number" required>
</div>

<div class="form-group">
<label>Email Address</label>
<input type="email" name="Email Address" required>
</div>

<div class="form-group">
<label>Home Address</label>
<textarea name="Address" rows="3" required></textarea>
</div>

<div class="form-group">
<label>Previous School</label>
<input type="text" name="Previous School">
</div>

<div class="form-group">
<label>Additional Information</label>
<textarea name="Additional Information" rows="4"></textarea>
</div>

<button type="submit" class="submit-btn">
Submit Application
</button>

</form>

</div>

</div>

</body>
</html>
