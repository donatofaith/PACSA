<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PACSA Admission Form</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="apply.css">
</head>

<body>

<div class="overlay"></div>

<div class="form-container">

    <div class="form-card">

        <img
            src="images/PACSA LOGO.png"
            alt="PACSA Logo"
            class="logo"
        >

        <h1>PACSA Admission Form</h1>

        <p class="subtitle">
            Complete the form below and our admissions team will contact you.
        </p>

        <form id="applicationForm">

            <div class="form-group">
                <label>Applicant Full Name</label>
                <input type="text" id="fullName" required>
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" id="dateOfBirth" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div class="form-group">
                <label>Class Applying For</label>
                <select id="classApplying" required>
                    <option value="">Select Class</option>
                    <option value="JSS1">JSS1</option>
                    <option value="JSS2">JSS2</option>
                    <option value="JSS3">JSS3</option>
                    <option value="SS1">SS1</option>
                    <option value="SS2">SS2</option>
                    <option value="SS3">SS3</option>
                </select>
            </div>

            <div class="form-group">
                <label>Parent/Guardian Name</label>
                <input type="text" id="parentName" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label>Home Address</label>
                <textarea id="address" rows="3" required></textarea>
            </div>

            <div class="form-group">
                <label>Previous School</label>
                <input type="text" id="previousSchool">
            </div>

            <div class="form-group">
                <label>Additional Information</label>
                <textarea id="additionalInformation" rows="4"></textarea>
            </div>

            <p id="formMessage"></p>

            <button
                type="submit"
                class="submit-btn"
                id="submitBtn">
                Submit Application
            </button>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
const form = document.getElementById("applicationForm");
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("formMessage");

form.addEventListener("submit", async function(e) {

    e.preventDefault();

    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";
    message.textContent = "";

    const application = {
        full_name: document.getElementById("fullName").value.trim(),
        date_of_birth: document.getElementById("dateOfBirth").value,
        gender: document.getElementById("gender").value,
        class: document.getElementById("classApplying").value,
        parent_name: document.getElementById("parentName").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim(),
        address: document.getElementById("address").value.trim(),
        previous_school: document.getElementById("previousSchool").value.trim(),
        additional_information:
            document.getElementById("additionalInformation").value.trim(),
        status: "pending"
    };

    const { error } = await supabaseClient
        .from("applications")
        .insert([application]);

    if (error) {

        console.error(error);

        message.textContent =
            "Could not submit application: " + error.message;

        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Application";

        return;
    }

    message.textContent =
        "Application submitted successfully! Our admissions team will contact you.";

    form.reset();

    submitBtn.disabled = false;
    submitBtn.textContent = "Submit Application";
});
</script>

</body>
</html>
