<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PACSA | Reset Admin Password</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family:
                "Outfit",
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                linear-gradient(
                    rgba(76, 29, 149, 0.72),
                    rgba(76, 29, 149, 0.72)
                ),
                url("images/Faith.jpg");

            background-size: cover;
            background-position: center;
        }


        .reset-card {
            width: 100%;
            max-width: 470px;

            padding:
                36px 34px;

            border-radius: 24px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.27
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    0.35
                );

            backdrop-filter:
                blur(18px);

            box-shadow:
                0 25px 60px
                rgba(
                    0,
                    0,
                    0,
                    0.25
                );

            color: white;
        }


        .logo {
            width: 70px;

            display: block;

            margin:
                0 auto 16px;
        }


        h1 {
            text-align: center;

            font-size: 28px;

            margin-bottom: 8px;
        }


        .subtitle {
            text-align: center;

            opacity: 0.9;

            font-size: 14px;

            margin-bottom: 30px;
        }


        .form-group {
            margin-bottom: 20px;
        }


        label {
            display: block;

            margin-bottom: 8px;

            font-weight: 600;

            font-size: 14px;
        }


        .password-box {
            position: relative;
        }


        .password-box input {
            width: 100%;

            padding:
                15px 48px 15px 15px;

            border: none;

            border-radius: 12px;

            outline: none;

            font-family: inherit;

            font-size: 15px;

            color: #111827;

            background: white;
        }


        .toggle-password {
            position: absolute;

            right: 15px;
            top: 50%;

            transform:
                translateY(-50%);

            cursor: pointer;

            user-select: none;
        }


        .reset-btn {
            width: 100%;

            border: none;

            padding: 15px;

            border-radius: 12px;

            background:
                #5b21b6;

            color: white;

            font-family: inherit;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 5px;
        }


        .reset-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }


        .message {
            display: none;

            margin-top: 18px;

            padding: 13px 14px;

            border-radius: 11px;

            font-size: 14px;

            line-height: 1.5;
        }


        .message.error {
            display: block;

            background:
                #fee2e2;

            color:
                #b91c1c;
        }


        .message.success {
            display: block;

            background:
                #dcfce7;

            color:
                #166534;
        }


        .back-link {
            display: block;

            text-align: center;

            margin-top: 22px;

            color: white;

            text-decoration: none;

            font-size: 14px;
        }


        .back-link:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

<div class="reset-card">

    <img
        src="images/PACSA LOGO.png"
        alt="PACSA Logo"
        class="logo"
    >

    <h1>
        Reset Admin Password
    </h1>

    <p class="subtitle">
        Create a new password for your PACSA Admin account.
    </p>


    <form id="resetForm">


        <div class="form-group">

            <label for="newPassword">
                New Password
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="newPassword"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <span
                    class="toggle-password"
                    id="toggleNewPassword"
                >
                    👁
                </span>

            </div>

        </div>


        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="confirmPassword"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <span
                    class="toggle-password"
                    id="toggleConfirmPassword"
                >
                    👁
                </span>

            </div>

        </div>


        <button
            type="submit"
            class="reset-btn"
            id="resetBtn"
        >
            Update Password
        </button>

    </form>


    <div
        id="message"
        class="message"
    ></div>


    <a
        href="admin-login.html"
        class="back-link"
    >
        ← Back to Admin Login
    </a>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

const $ = id =>
    document.getElementById(id);


function showMessage(
    text,
    type = "error"
) {

    const box =
        $("message");


    box.textContent =
        text;


    box.className =
        `message ${type}`;
}


function setupToggle(
    inputId,
    toggleId
) {

    const input =
        $(inputId);

    const toggle =
        $(toggleId);


    toggle.addEventListener(
        "click",
        () => {

            const hidden =
                input.type ===
                "password";


            input.type =
                hidden
                    ? "text"
                    : "password";


            toggle.textContent =
                hidden
                    ? "🙈"
                    : "👁";
        }
    );
}


setupToggle(
    "newPassword",
    "toggleNewPassword"
);


setupToggle(
    "confirmPassword",
    "toggleConfirmPassword"
);


/* =========================================
   CHECK RECOVERY SESSION
========================================= */

async function checkRecoverySession() {

    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .getSession();


        if (
            error
        ) {
            throw error;
        }


        if (
            !data?.session
        ) {

            showMessage(
                "This password reset link is invalid or has expired."
            );


            $("resetBtn")
                .disabled =
                true;
        }


    } catch (error) {

        console.error(
            "Recovery session error:",
            error
        );


        showMessage(
            "This password reset link is invalid or has expired."
        );


        $("resetBtn")
            .disabled =
            true;
    }
}


checkRecoverySession();


/* =========================================
   UPDATE PASSWORD
========================================= */

$("resetForm")
    .addEventListener(
        "submit",
        async event => {

            event.preventDefault();


            const newPassword =
                $("newPassword")
                    .value;


            const confirmPassword =
                $("confirmPassword")
                    .value;


            const button =
                $("resetBtn");


            if (
                newPassword.length < 8
            ) {

                showMessage(
                    "Password must contain at least 8 characters."
                );

                return;
            }


            if (
                newPassword !==
                confirmPassword
            ) {

                showMessage(
                    "Passwords do not match."
                );

                return;
            }


            button.disabled =
                true;

            button.textContent =
                "Updating...";


            try {

                const {
                    error
                } =
                    await supabaseClient
                        .auth
                        .updateUser({
                            password:
                                newPassword
                        });


                if (
                    error
                ) {
                    throw error;
                }


                showMessage(
                    "Password updated successfully. You can now login with your new password.",
                    "success"
                );


                $("newPassword").value =
                    "";

                $("confirmPassword").value =
                    "";


                await supabaseClient
                    .auth
                    .signOut();


                setTimeout(
                    () => {

                        window.location.replace(
                            "admin-login.html"
                        );

                    },
                    1800
                );


            } catch (error) {

                console.error(
                    "Admin password update:",
                    error
                );


                showMessage(
                    error?.message ||
                    "Could not update the password."
                );


            } finally {

                button.disabled =
                    false;

                button.textContent =
                    "Update Password";
            }
        }
    );

</script>


</body>

</html>
