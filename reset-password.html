<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reset Teacher Password | PACSA</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center;align-items:center;padding:20px;background:linear-gradient(135deg,#4c1d95,#7c3aed)}.card{width:100%;max-width:450px;background:white;padding:35px;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.2)}.logo{display:block;width:70px;height:70px;object-fit:contain;margin:0 auto 15px}h1{text-align:center;margin:0 0 8px;color:#5b21b6}.subtitle{text-align:center;color:#666;margin-bottom:28px;line-height:1.5}label{display:block;margin-bottom:8px;font-weight:bold}.field{position:relative;margin-bottom:20px}input{width:100%;height:52px;padding:0 48px 0 15px;border:1px solid #ccc;border-radius:10px;font-size:16px;outline:none}input:focus{border-color:#7c3aed}.eye{position:absolute;right:14px;top:39px;border:0;background:transparent;cursor:pointer;font-size:18px}.password-help{display:block;margin-top:7px;color:#6B7280;font-size:12px;line-height:1.45}.submit-btn{width:100%;height:52px;border:none;border-radius:10px;background:#6d28d9;color:white;font-weight:bold;font-size:16px;cursor:pointer}.submit-btn:disabled{opacity:.6;cursor:not-allowed}.message{display:none;margin-top:18px;padding:13px;border-radius:9px;text-align:center;line-height:1.4}.message.error{display:block;background:#fee2e2;color:#b91c1c}.message.success{display:block;background:#dcfce7;color:#166534}.back{display:block;margin-top:20px;text-align:center;color:#6d28d9;text-decoration:none;font-weight:bold}</style>
</head>
<body>
<div class="card"><img src="images/PACSA LOGO.png" alt="PACSA Logo" class="logo"><h1>Create New Password</h1><p class="subtitle">Use a strong password for your Teacher Portal account.</p><form id="resetForm"><div class="field"><label for="newPassword">New Password</label><input type="password" id="newPassword" minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[^A-Za-z0-9]).{8,}" title="Use at least 8 characters with uppercase, lowercase and a special character." required><button type="button" class="eye" data-toggle="newPassword">👁</button><small class="password-help">Must include uppercase, lowercase and a special character.</small></div><div class="field"><label for="confirmPassword">Confirm New Password</label><input type="password" id="confirmPassword" minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[^A-Za-z0-9]).{8,}" title="Use at least 8 characters with uppercase, lowercase and a special character." required><button type="button" class="eye" data-toggle="confirmPassword">👁</button></div><button type="submit" id="resetBtn" class="submit-btn">Update Password</button><div id="message" class="message"></div></form><a href="teacher-login.html" class="back">← Back to Teacher Login</a></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script>
<script>
const $=id=>document.getElementById(id);
function showMessage(text,type="error"){const box=$("message");box.textContent=text;box.className=`message ${type}`}
document.querySelectorAll("[data-toggle]").forEach(button=>button.addEventListener("click",()=>{const input=$(button.dataset.toggle);const hidden=input.type==="password";input.type=hidden?"text":"password";button.textContent=hidden?"🙈":"👁";}));
function passwordError(password){if(password.length<8)return "Password must contain at least 8 characters.";if(!/[A-Z]/.test(password))return "Password must include an uppercase letter.";if(!/[a-z]/.test(password))return "Password must include a lowercase letter.";if(!/[^A-Za-z0-9]/.test(password))return "Password must include a special character.";return "";}
$("resetForm").addEventListener("submit",async event=>{event.preventDefault();const password=$("newPassword").value;const confirmPassword=$("confirmPassword").value;const button=$("resetBtn");const validation=passwordError(password);if(validation){showMessage(validation);return}if(password!==confirmPassword){showMessage("Passwords do not match.");return}button.disabled=true;button.textContent="Updating...";try{const {data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();if(sessionError)throw sessionError;if(!sessionData?.session)throw new Error("This password reset link is invalid or expired. Please request a new one.");const {error}=await supabaseClient.auth.updateUser({password});if(error)throw error;showMessage("Password changed successfully. Redirecting to login...","success");await supabaseClient.auth.signOut();setTimeout(()=>window.location.replace("teacher-login.html"),1800)}catch(error){console.error("Password reset error:",error);showMessage(error?.message||"Could not update password.")}finally{button.disabled=false;button.textContent="Update Password"}});
</script>
</body>
</html>
