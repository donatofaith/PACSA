<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PACSA Student Portal</title>

<link
href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="student-login.css">

</head>

<body>

<div class="overlay"></div>

<div class="login-container">

<div class="login-card">

<img
src="images/PACSA LOGO.png"
alt="PACSA Logo"
class="logo">

<h1>PACSA</h1>

<p class="motto">

Becoming Leaders Through Righteousness

</p>

<form id="studentLoginForm">

<div class="input-group">

<label>
Student ID
</label>

<input
type="text"
id="studentId"
placeholder="Enter Student ID"
required>

</div>

<div class="input-group">

<label>
Password
</label>

<div class="password-box">

<input
type="password"
id="password"
placeholder="Enter Password"
required>

<span id="togglePassword">

👁

</span>

</div>

</div>

<div class="extras">

<label>

<input type="checkbox">

Remember Me

</label>

<a href="#">

Forgot Password?

</a>

</div>

<button
type="submit"
class="login-btn">

Login

</button>

</form>

</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="student-login.js"></script>
</body>

</html>
